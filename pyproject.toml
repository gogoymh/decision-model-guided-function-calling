[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmfc"
version = "0.1.0"
description = "Decision Model Guided Function Calling: verify and repair LLM tool calls with cumulative feedback"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "function-calling", "tool-use", "verification", "agents", "jev", "bfcl"]
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pypdf>=5,<7"]

[project.scripts]
dmfc-eval = "jev_fc.cli:main"
jev-fc = "jev_fc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dmfc", "src/jbfc", "src/jev_fc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
