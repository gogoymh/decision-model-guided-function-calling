[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-backed-function-calling"
version = "0.1.0"
description = "Reproducible BFCL experiments with Jev verification and bounded function-call repair"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pypdf>=5,<7"]

[project.scripts]
jev-fc = "jev_fc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_fc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
